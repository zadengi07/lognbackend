<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server holati</title>

  <!-- ICONS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, green, black);
      font-family: Arial, sans-serif;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 30px 40px;
      border-radius: 15px;
      text-align: center;
      color: #fff;
      box-shadow: 0 15px 40px rgba(152, 152, 152, 0.3);
      animation: fadeIn 1s ease-in-out;
      transition: 1s;
    }
    .card:hover{
       box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
    }

    .card i {
      font-size: 48px;
      color: #4ade80;
      margin-bottom: 15px;
    }

    .card h1 {
      font-size: 22px;
      margin: 10px 0;
    }

    .card p {
      font-size: 16px;
      opacity: 0.9;
    }

    .port {
      margin-top: 10px;
      font-weight: bold;
      color: #facc15;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <i class="fa-solid fa-server"></i>
    <h1>Server faol holatda</h1>
    <p>Barcha xizmatlar ishlayapti</p>
    <div class="port">PORT: 5000</div>
  </div>

</body>
</html>
